<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--ck-void);color:var(--ck-white)}a{color:var(--ck-cyan)}a:hover{color:var(--ck-cyan-bright)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ck-muted)}</style></head><body><style>.dm{transition:transform 200ms cubic-bezier(.16,1,.3,1),box-shadow 200ms cubic-bezier(.16,1,.3,1)}.dm:hover{transform:translateY(-4px);box-shadow:var(--ck-shadow-card-hover)}</style>
<div class="wrap"><div class="row" style="gap:16px">
<div style="flex:1;padding:18px;border-radius:20px;background:var(--ck-elevated);border:1px solid var(--ck-border);box-shadow:var(--ck-shadow-card)"><div style="font-family:var(--font-display);font-weight:600;font-size:16px">Rest</div><div style="font-size:12px;color:var(--ck-muted);margin-top:6px">8px blur, no lift</div></div>
<div class="dm" style="flex:1;padding:18px;border-radius:20px;background:var(--ck-elevated);border:1px solid var(--ck-border);box-shadow:var(--ck-shadow-card)"><div style="font-family:var(--font-display);font-weight:600;font-size:16px">Hover me</div><div style="font-size:12px;color:var(--ck-muted);margin-top:6px">-4px, 24px blur</div></div>
</div></div></body></html>
