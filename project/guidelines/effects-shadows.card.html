<!-- @dsCard group="Spacing" viewport="700x160" name="Shadow system" subtitle="Cyan glow on buttons; neutral depth on cards" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--ck-void);color:var(--ck-white)}a{color:var(--ck-cyan)}a:hover{color:var(--ck-cyan-bright)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ck-muted)}</style></head><body><div class="wrap"><div class="row" style="gap:20px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:150px;height:44px;border-radius:999px;background:var(--ck-grad-button);box-shadow:var(--ck-shadow-glow)"></div><div style="font-size:11px;color:var(--ck-muted)">Glow · rgba(19,176,232,.35)</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:150px;height:44px;border-radius:12px;background:var(--ck-elevated);border:1px solid var(--ck-border);box-shadow:var(--ck-shadow-card)"></div><div style="font-size:11px;color:var(--ck-muted)">Card rest · 8px blur</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:150px;height:44px;border-radius:12px;background:var(--ck-elevated);border:1px solid var(--ck-border-strong);box-shadow:var(--ck-shadow-card-hover)"></div><div style="font-size:11px;color:var(--ck-muted)">Card hover · 24px blur</div></div>
</div></div></body></html>
