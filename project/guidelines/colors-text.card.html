<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);background:var(--ck-void);color:var(--ck-white)}a{color:var(--ck-cyan)}a:hover{color:var(--ck-cyan-bright)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ck-muted)}</style></head><body><div class="wrap"><div class="row">
