<!-- @dsCard group="Website" viewport="1440x900" name="Homepage 2026" subtitle="Modern redesign of the codekerdos.in homepage — dark mesh hero, bento, course rail" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeKerdos — Homepage</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./data.js"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;padding:0}
body{background:var(--ck-void);color:var(--ck-white);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--ck-cyan);text-decoration:none}a:hover{color:var(--ck-cyan-bright)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0}p{margin:0}
::selection{background:var(--ck-cyan);color:#000}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}.wrap.narrow{max-width:900px}

/* nav */
.nav{position:sticky;top:0;z-index:50;transition:background .3s,border-color .3s,backdrop-filter .3s;border-bottom:1px solid transparent}
.nav[data-solid="1"]{background:rgba(4,7,14,.72);backdrop-filter:blur(18px) saturate(160%);border-bottom-color:var(--ck-border)}
.nav-in{max-width:1200px;margin:0 auto;padding:16px 40px;display:flex;align-items:center;gap:40px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ck-white)}
.brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:800 13px/1 var(--font-display);letter-spacing:-.5px;color:#001018;background:var(--ck-grad-button)}
.brand-word{font:800 17px/1 var(--font-display);letter-spacing:-.4px}
.nav-links{display:flex;gap:28px;margin-right:auto}
.nav-links a{color:var(--ck-muted);font-size:14px;font-weight:500}.nav-links a:hover{color:var(--ck-white)}
.nav-cta{display:flex;gap:12px;align-items:center}
.ghost-btn{color:var(--ck-white);font-size:14px;font-weight:600}
.pill-btn{background:var(--ck-white);color:#000;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .2s,box-shadow .2s}
.pill-btn:hover{color:#000;transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,198,255,.28)}

/* hero */
.hero{position:relative;padding:120px 0 96px;overflow:hidden;border-bottom:1px solid var(--ck-border)}
.mesh{position:absolute;inset:-20% -10% auto;height:900px;pointer-events:none;filter:blur(90px);opacity:.55}
.mesh.sm{height:520px;opacity:.45}
.orb{position:absolute;display:block;border-radius:50%}
.o1{width:620px;height:620px;left:8%;top:0;background:radial-gradient(circle,#0072FF 0%,transparent 70%);animation:drift 16s ease-in-out infinite alternate}
.o2{width:520px;height:520px;right:6%;top:60px;background:radial-gradient(circle,#00C6FF 0%,transparent 70%);animation:drift 20s ease-in-out infinite alternate-reverse}
.o3{width:420px;height:420px;left:42%;top:260px;background:radial-gradient(circle,#FF7A59 0%,transparent 70%);opacity:.5;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(60px,-40px,0) scale(1.12)}}
.grid-lines{position:absolute;inset:0;background-image:linear-gradient(var(--ck-border) 1px,transparent 1px),linear-gradient(90deg,var(--ck-border) 1px,transparent 1px);background-size:72px 72px;opacity:.25;mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent 75%)}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:0 40px}
.hero-badge{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--ck-border-strong);background:rgba(17,24,39,.6);backdrop-filter:blur(8px);color:var(--ck-white);font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ck-success);box-shadow:0 0 0 4px rgba(34,197,94,.18);animation:blip 2s infinite}
@keyframes blip{50%{opacity:.35}}
.hero-h1{margin:26px 0 0;font-size:clamp(44px,6.4vw,88px);font-weight:800;line-height:1.02;letter-spacing:-3px;text-wrap:balance}
.hero-h1 em{font-style:normal;background:var(--ck-grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{max-width:620px;margin:26px 0 0;color:var(--ck-muted);font-size:18px;line-height:1.62;text-wrap:pretty}
.hero-actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}.hero-actions.center{justify-content:center}
.cta-primary{display:inline-flex;align-items:center;gap:10px;background:var(--ck-grad-button);color:#001018;font-weight:700;font-size:15px;padding:15px 26px;border-radius:12px;transition:transform .2s,box-shadow .2s}
.cta-primary:hover{color:#001018;transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,114,255,.4)}
.cta-primary .arrow{transition:transform .2s}.cta-primary:hover .arrow{transform:translateX(4px)}
.cta-secondary{display:inline-flex;align-items:center;color:var(--ck-white);font-weight:600;font-size:15px;padding:15px 24px;border-radius:12px;border:1px solid var(--ck-border-strong);transition:border-color .2s,background .2s}
.cta-secondary:hover{color:var(--ck-white);border-color:var(--ck-cyan);background:rgba(19,176,232,.08)}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:72px;background:var(--ck-border);border:1px solid var(--ck-border);border-radius:16px;overflow:hidden}
.hstat{background:rgba(11,15,26,.72);backdrop-filter:blur(6px);padding:22px 24px;display:grid;gap:6px}
.hstat b{font:800 34px/1 var(--font-display);letter-spacing:-1.4px;color:var(--ck-white)}
.hstat span{font-size:13px;color:var(--ck-muted)}

/* marquee */
.marquee-wrap{padding:44px 0;border-bottom:1px solid var(--ck-border);background:var(--ck-surface)}
.marquee-label{text-align:center;font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ck-ink-muted);margin-bottom:24px}
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marquee-track{display:flex;gap:56px;width:max-content;animation:slide 34s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.logo-chip{font:700 22px/1 var(--font-display);letter-spacing:-.6px;color:#4B5670;white-space:nowrap;transition:color .3s}
.logo-chip:hover{color:var(--ck-white)}

/* sections */
.sec{padding:110px 0}
.sec-dark{background:var(--ck-void)}
.sec-tint{background:var(--ck-tint-cyan);color:var(--ck-ink)}
.sec-head{max-width:720px;margin-bottom:56px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ck-cyan)}
.sec-title{margin-top:14px;font-size:clamp(30px,3.4vw,46px);font-weight:800;letter-spacing:-1.4px;line-height:1.08;text-wrap:balance}
.sec-sub{margin-top:16px;color:var(--ck-muted);font-size:17px;line-height:1.6;text-wrap:pretty}
.sec-head.on-tint .eyebrow{color:var(--ck-teal-deep)}.sec-head.on-tint .sec-sub{color:var(--ck-ink-muted)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bento-card{background:linear-gradient(180deg,#0E1421,#0A0E18);border:1px solid var(--ck-border);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:10px;transition:border-color .25s,transform .25s,background .25s}
.bento-card:hover{border-color:var(--ck-outline);transform:translateY(-3px);background:linear-gradient(180deg,#121A2A,#0A0E18)}
.b-wide{grid-column:span 2}.b-tall{grid-row:span 2}
.bento-top{display:flex;align-items:center;justify-content:space-between}
.num{font:800 13px/1 var(--font-display);letter-spacing:1px;color:var(--ck-cyan)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#FFB4A0}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ck-orange);animation:blip 1.6s infinite}
.bento-card h3{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-top:4px}
.bento-card p{color:var(--ck-muted);font-size:14px;line-height:1.62}

/* course rail */
.rail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
.rail-head .sec-head{margin-bottom:56px}
.rail-nav{display:flex;gap:10px;margin-bottom:60px}
.rail-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ck-border-strong);background:transparent;color:var(--ck-white);font-size:17px;cursor:pointer;transition:border-color .2s,background .2s}
.rail-nav button:hover{border-color:var(--ck-cyan);background:rgba(19,176,232,.1)}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-pad{flex:0 0 max(40px,calc((100vw - 1200px)/2 + 40px))}
.course{flex:0 0 380px;scroll-snap-align:center;background:var(--ck-elevated);border:1px solid var(--ck-border);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;transition:transform .25s,border-color .25s}
.course:hover{transform:translateY(-4px);border-color:var(--ck-cyan)}
.course-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ck-muted)}
.rating{color:#FFC773;font-weight:700}.sep{opacity:.4}
.course h3{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.24}
.course p{color:var(--ck-muted);font-size:14px;line-height:1.6;flex:1}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(19,176,232,.12);color:#7FD8F7;border:1px solid rgba(19,176,232,.22)}
.course-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:16px;border-top:1px solid var(--ck-border)}
.mentor{display:flex;align-items:center;gap:10px}
.mentor span:last-child{display:grid}
.mentor b{font-size:13px;font-weight:600}.mentor em{font-style:normal;font-size:11.5px;color:var(--ck-ink-muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--font-display);color:#001018;background:var(--ck-grad-orb)}
.avatar.dark{background:var(--ck-ink);color:#fff}
.avatar.lg{width:56px;height:56px;flex-basis:56px;font-size:17px}
.learners{font-size:11.5px;color:var(--ck-ink-muted);white-space:nowrap}
.course-link{font-size:14px;font-weight:700}

/* comparison */
.cmp{border:1px solid var(--ck-border);border-radius:18px;overflow:hidden}
.cmp-head,.cmp-row{display:grid;grid-template-columns:1.1fr 1.4fr 1.2fr;gap:20px;padding:18px 24px;align-items:center}
.cmp-head{background:var(--ck-surface);font-size:13px;letter-spacing:.4px}
.cmp-head .ours{color:var(--ck-cyan)}.cmp-head .theirs{color:var(--ck-ink-muted)}
.cmp-row{border-top:1px solid var(--ck-border);font-size:14.5px}
.cmp-row:hover{background:rgba(19,176,232,.04)}
.cmp-label{color:var(--ck-white);font-weight:600}
.cmp-ours{display:flex;align-items:center;gap:9px;color:var(--ck-white)}
.tick{width:19px;height:19px;flex:0 0 19px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:rgba(34,197,94,.16);color:var(--ck-success)}
.cmp-theirs{color:var(--ck-ink-muted)}

/* quotes */
.quotes{columns:3;column-gap:18px}
.quote{margin:0 0 18px;break-inside:avoid;padding:26px;border-radius:20px;background:#fff;border:1px solid rgba(11,15,26,.07);display:grid;gap:20px}
.quote.t-cyan{background:#fff}.quote.t-teal{background:var(--ck-tint-teal)}.quote.t-orange{background:var(--ck-tint-orange)}.quote.t-neutral{background:var(--ck-tint-neutral)}
.quote blockquote{margin:0;font:600 17px/1.5 var(--font-display);letter-spacing:-.3px;color:var(--ck-ink);text-wrap:pretty}
.quote figcaption{display:flex;align-items:center;gap:11px}
.quote figcaption span:last-child{display:grid}
.quote b{font-size:14px;color:var(--ck-ink)}.quote em{font-style:normal;font-size:12.5px;color:var(--ck-ink-muted)}

/* mentors */
.mentors{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mcard{background:var(--ck-elevated);border:1px solid var(--ck-border);border-radius:16px;padding:22px;display:grid;gap:8px;justify-items:start;transition:border-color .25s,transform .25s}
.mcard:hover{border-color:var(--ck-outline);transform:translateY(-3px)}
.mcard b{font-size:14.5px;margin-top:6px}.mcard em{font-style:normal;font-size:12.5px;color:var(--ck-muted);line-height:1.45}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ck-border);border:1px solid var(--ck-border);border-radius:20px;overflow:hidden}
.steps li{background:var(--ck-void);padding:30px 26px;display:flex;gap:18px}
.steps li:hover{background:var(--ck-surface)}
.step-n{font:800 15px/1 var(--font-display);color:var(--ck-cyan);padding-top:3px}
.steps h3{font-size:17px;font-weight:700;letter-spacing:-.2px}
.steps p{margin-top:8px;color:var(--ck-muted);font-size:13.5px;line-height:1.6}

/* faq */
.faq{border-top:1px solid var(--ck-border)}
.faq-item{border-bottom:1px solid var(--ck-border)}
.faq-item button{width:100%;background:none;border:0;color:var(--ck-white);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 0;cursor:pointer;text-align:left;font:600 18px/1.35 var(--font-display);letter-spacing:-.3px}
.faq-item button i{font-style:normal;font-size:24px;color:var(--ck-cyan);flex:0 0 auto}
.faq-item p{color:var(--ck-muted);font-size:15px;line-height:1.66;padding-bottom:26px;max-width:760px;text-wrap:pretty}
.faq-item.is-open button{color:var(--ck-cyan-bright)}

/* cta + footer */
.cta-band{position:relative;overflow:hidden;padding:120px 0;border-top:1px solid var(--ck-border);text-align:center}
.cta-in{position:relative}
.cta-band h2{font-size:clamp(32px,4vw,54px);font-weight:800;letter-spacing:-2px;line-height:1.06}
.cta-band p{max-width:560px;margin:20px auto 0;color:var(--ck-muted);font-size:17px;line-height:1.6}
.foot{border-top:1px solid var(--ck-border);background:var(--ck-surface);padding:64px 0 28px}
.foot-in{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:40px}
.foot-brand p{margin-top:16px;color:var(--ck-muted);font-size:14px;line-height:1.6;max-width:280px}
.foot-col{display:grid;gap:11px;align-content:start}
.foot-col h4{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ck-ink-muted);margin-bottom:4px}
.foot-col a{color:var(--ck-muted);font-size:14px}.foot-col a:hover{color:var(--ck-white)}
.foot-base{display:flex;justify-content:space-between;margin-top:56px;padding-top:22px;border-top:1px solid var(--ck-border);font-size:12.5px;color:var(--ck-ink-muted)}

@media(max-width:1080px){.bento{grid-template-columns:repeat(2,1fr)}.mentors{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.quotes{columns:2}.hero-stats{grid-template-columns:repeat(2,1fr)}.nav-links{display:none}}
@media(max-width:720px){.wrap,.hero-in,.nav-in{padding-left:22px;padding-right:22px}.bento,.mentors,.steps,.foot-in{grid-template-columns:1fr}.quotes{columns:1}.b-wide,.b-tall{grid-column:auto;grid-row:auto}.course{flex-basis:300px}.cmp-head,.cmp-row{grid-template-columns:1fr}.sec{padding:72px 0}}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./Programs.jsx"></script>
<script type="text/babel" src="./Proof.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(
  <div><Nav /><Hero /><Marquee /><Why /><Programs /><Compare /><Outcomes /><Mentors /><Journey /><Faq /><Cta /><Foot /></div>
);
</script>
</body></html>
