<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CodeKerdos — redesign</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../website/data.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--ck-void);color:var(--ck-white);font-family:var(--font-body);-webkit-font-smoothing:antialiased}a{color:var(--ck-cyan);text-decoration:none}a:hover{color:var(--ck-cyan-bright)}input,select,button{font-family:var(--font-body)}::selection{background:var(--ck-cyan);color:#000}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./Mocks.jsx"></script>
<script type="text/babel" src="./RedesignHomeScreen.jsx"></script>
<script type="text/babel" src="../website/CourseScreen.jsx"></script>
<script type="text/babel" src="../website/ContactScreen.jsx"></script>
<script type="text/babel">
const { NavBar, Footer } = window.CodeKerdosDesignSystem_68bc71;
const LOGO = '../../assets/codekerdos-logo-full.jpeg';

function App() {
  const [screen, setScreen] = React.useState('home');
  const [slug, setSlug] = React.useState('dsa-system-design');
  const go = id => { setScreen(id === 'courses' ? 'home' : id); window.scrollTo(0, 0); };
  const openCourse = s => { setSlug(s); setScreen('course'); window.scrollTo(0, 0); };
  return (
    <div>
      <NavBar logo={LOGO} links={window.CK_DATA.nav} active={screen} onNavigate={go} />
      {screen === 'home' ? <RedesignHomeScreen onNavigate={go} onOpenCourse={openCourse} /> : null}
      {screen === 'course' ? <CourseScreen slug={slug} onNavigate={go} onOpenCourse={openCourse} /> : null}
      {screen === 'contact' ? <ContactScreen onNavigate={go} /> : null}
      <Footer logo={LOGO} columns={[
        { title: 'Pages', links: ['Overview','Courses','Masterclass','Testimonials','FAQs','Contact Us'] },
        { title: 'Courses', links: ['DSA + System Design','DevOps & SRE','Generative AI','AI FDE Program','Cloud & DevOps'] },
        { title: 'Follow Us', links: ['Facebook','Instagram','LinkedIn','Youtube'] }
      ]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
